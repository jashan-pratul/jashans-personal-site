<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <rect width="960" height="560" fill="#07090E"/>
  <rect x="44" y="34" width="872" height="492" rx="10" fill="#0C1018" stroke="#F2EFE9" stroke-opacity="0.14"/>
  <rect x="44" y="34" width="872" height="48" rx="10" fill="#121824"/>
  <line x1="44" y1="82" x2="916" y2="82" stroke="#F2EFE9" stroke-opacity="0.1"/>

  <circle cx="72" cy="58" r="5" fill="#FF5500"/>
  <text x="88" y="62" fill="#F2EFE9" font-family="monospace" font-size="13" font-weight="700">JARVIS MINI — 3D REACTOR PWA &amp; LOCAL COMMAND PARSER</text>
  <text x="676" y="62" fill="#38BDF8" font-family="monospace" font-size="10">Three.js · Express 5 · SQLite · Gemini</text>

  <!-- Left: 3D Gyroscopic Reactor Visualization -->
  <rect x="66" y="102" width="390" height="402" rx="6" fill="#070A10" stroke="#F2EFE9" stroke-opacity="0.1"/>
  <text x="86" y="128" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">REACT-THREE-FIBER HOLOGRAPHIC REACTOR</text>

  <!-- Concentric Gyroscopic Rings -->
  <circle cx="261" cy="286" r="112" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="261" cy="286" r="88" stroke="#FF5500" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="28 10"/>
  <ellipse cx="261" cy="286" rx="104" ry="42" transform="rotate(-28 261 286)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5"/>
  <ellipse cx="261" cy="286" rx="104" ry="42" transform="rotate(32 261 286)" stroke="#FF5500" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="261" cy="286" r="46" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="261" cy="286" r="18" fill="#FF5500"/>

  <!-- State Pills -->
  <text x="86" y="446" fill="#A19E97" font-family="monospace" font-size="10">STATES: IDLE · LISTENING · THINKING · SPEAKING · ERROR</text>
  <text x="86" y="468" fill="#6E6B65" font-family="monospace" font-size="9">Adaptive DPR [1, 1.5] + 2D SVG fallback for mobile GPUs</text>

  <!-- Right: Deterministic Math Parser & SSE Stream -->
  <rect x="474" y="102" width="420" height="402" rx="6" fill="#070A10" stroke="#F2EFE9" stroke-opacity="0.1"/>
  <text x="494" y="128" fill="#FF5500" font-family="monospace" font-size="10" font-weight="700">LOCAL COMMAND PARSER &amp; GEMINI 2.5 FLASH SSE</text>

  <rect x="494" y="148" width="380" height="104" rx="6" fill="#101520" stroke="#FF5500" stroke-opacity="0.45"/>
  <text x="510" y="170" fill="#FF5500" font-family="monospace" font-size="10" font-weight="700">1. src/utils/mathEval.ts (Zero eval() Parser)</text>
  <text x="510" y="192" fill="#F2EFE9" font-family="monospace" font-size="11">&gt; "JARVIS, calculate 987 multiplied by 654"</text>
  <text x="510" y="214" fill="#10B981" font-family="monospace" font-size="11">Tokens: [987] [*] [654] → Result: 645,498</text>
  <text x="510" y="234" fill="#A19E97" font-family="monospace" font-size="9">Recursive-descent AST evaluation · 0ms network latency</text>

  <rect x="494" y="266" width="380" height="96" rx="6" fill="#101520" stroke="#38BDF8" stroke-opacity="0.35"/>
  <text x="510" y="288" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">2. src/utils/commandParser.ts + SQLite</text>
  <text x="510" y="310" fill="#F2EFE9" font-family="monospace" font-size="10">• Deterministic site launcher with popup-blocker guard</text>
  <text x="510" y="330" fill="#F2EFE9" font-family="monospace" font-size="10">• Express 5 + better-sqlite3 persistent memory store</text>
  <text x="510" y="348" fill="#A19E97" font-family="monospace" font-size="9">• Web Speech API push-to-talk + en-GB SpeechSynthesis</text>

  <rect x="494" y="376" width="380" height="106" rx="6" fill="#101520" stroke="#F2EFE9" stroke-opacity="0.1"/>
  <text x="510" y="398" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">3. server/services/geminiService.ts (/api/chat SSE)</text>
  <text x="510" y="420" fill="#A19E97" font-family="monospace" font-size="10">@google/genai SDK streaming with Google Search</text>
  <text x="510" y="438" fill="#A19E97" font-family="monospace" font-size="10">grounding &amp; clickable source citations when backend</text>
  <text x="510" y="456" fill="#A19E97" font-family="monospace" font-size="10">is running with GEMINI_API_KEY configured.</text>
</svg>