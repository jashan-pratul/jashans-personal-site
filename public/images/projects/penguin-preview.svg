  <text x="558" y="380" fill="#A19E97" font-family="monospace" font-size="10">Evaluated via:</text>
  <text x="558" y="398" fill="#38BDF8" font-family="monospace" font-size="10">• accuracy_score(y_test, y_pred)</text>
  <text x="558" y="416" fill="#38BDF8" font-family="monospace" font-size="10">• confusion_matrix(y_test, y_pred)</text>
  <text x="558" y="434" fill="#38BDF8" font-family="monospace" font-size="10">• classification_report(y_test, y_pred)</text>
